name: Verify public APT upgrade
on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Version to upgrade from, for example 0.6.3
        required: true
        type: string
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Upgrade through the public signed APT repository
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: bash packaging/check-apt-upgrade.sh "$PREVIOUS_VERSION"
